name: CalculusClash
description: A platform to debate the contributions of Newton and Lagrange.

entities:
  User:
    authenticable: true
    properties:
      - name
      - { name: email, type: email }
      - { name: role, type: choice, options: { values: [admin, user], default: user } }
    policies:
      signup:
        - access: public
      create:
        - access: admin
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - access: admin

  Argument:
    properties:
      - { name: title, type: string }
      - { name: content, type: text }
      - { name: champion, type: choice, options: { values: [Newton, Lagrange] } }
      - { name: upvotes, type: number, options: { default: 0 } }
    belongsTo:
      - { name: author, entity: User }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User, condition: self }
        - access: admin
      delete:
        - { access: restricted, allow: User, condition: self }
        - access: admin


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck